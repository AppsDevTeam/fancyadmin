# FancyAdmin: Prevent server-side execution of uploaded files (ASVS 5.3.1)
#
# Include this in your nginx server block:
#   include /path/to/vendor/adt/fancyadmin/config/nginx/uploads.conf;
#
# Adjust the location path to match your FileListener dataDir/dataUrl configuration.

location ~* ^/files/.*\.php$ {
    deny all;
    return 403;
}
